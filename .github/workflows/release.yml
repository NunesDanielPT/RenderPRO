name: RenderPRO — build e release

# Cada push para main compila o RenderPRO em Windows e corre todos os testes,
# incluindo renders reais com o FFmpeg que vai no instalador.
# Se ainda não existir a release vX.Y.Z (versão do tauri.conf.json), cria-a com
# o instalador. Para lançar uma versão nova: subir a versão em
# src-tauri/tauri.conf.json, src-tauri/Cargo.toml e package.json, escrever a
# secção no CHANGELOG.md e fazer push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Versão
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($v -ne $cargo -or $v -ne $npm) { throw "Versões diferentes: tauri.conf.json $v, Cargo.toml $cargo, package.json $npm" }
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          $publish = if ($LASTEXITCODE -eq 0) { 'false' } else { 'true' }
          Write-Host "Versão $v; publicar release: $publish"
          "version=$v" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/ffmpeg/*.exe
            src-tauri/ffmpeg/*.dll
            src-tauri/ffmpeg/FFMPEG-LICENSE.txt
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}-v1

      - name: FFmpeg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Testes (unitários + renders reais com o FFmpeg incluído)
        run: |
          $env:PATH = "$PWD\src-tauri\ffmpeg;$env:PATH"
          cargo test --manifest-path src-tauri/Cargo.toml -- --include-ignored --test-threads=2

      - name: Dependências
        run: npm ci

      - name: Compilar instalador
        run: npx tauri build --bundles nsis

      - name: Preparar ficheiros
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw 'Instalador NSIS não encontrado' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/RenderPRO-Setup.exe
          Copy-Item $exe.FullName "dist/RenderPRO-Setup-$v.exe"
          $hash = (Get-FileHash dist/RenderPRO-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  RenderPRO-Setup.exe" | Out-File -Encoding ascii -NoNewline dist/RenderPRO-Setup.exe.sha256
          Write-Host ("Instalador: {0:N1} MB" -f ((Get-Item dist/RenderPRO-Setup.exe).Length / 1MB))

          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $out = @(); $inside = $false
          foreach ($l in $lines) {
            if ($l -match '^##\s+v?(\S+)') { $inside = ($Matches[1] -eq $v); continue }
            if ($inside) { $out += $l }
          }
          $notes = ($out -join "`n").Trim()
          if (-not $notes) { $notes = "RenderPRO v$v" }
          $notes | Out-File -Encoding utf8 dist/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: RenderPRO-Setup-${{ steps.version.outputs.version }}
          path: dist/RenderPRO-Setup.exe

      - name: Publicar release v${{ steps.version.outputs.version }}
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: RenderPRO v${{ steps.version.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/RenderPRO-Setup.exe
            dist/RenderPRO-Setup-${{ steps.version.outputs.version }}.exe
            dist/RenderPRO-Setup.exe.sha256

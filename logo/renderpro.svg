<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e24"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45cff"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="210" fill="url(#bg)" stroke="#2a2f38" stroke-width="12"/>
  <!-- anel de conversão: dois arcos com setas -->
  <g fill="none" stroke="url(#acc)" stroke-width="64" stroke-linecap="round" filter="url(#glow)">
    <path d="M 249.9 456.3 A 268 268 0 0 1 669.5 295.2"/>
    <path d="M 774.1 567.7 A 268 268 0 0 1 354.5 728.8"/>
  </g>
  <g fill="url(#acc)">
    <path d="M 717.3 339.7 L 623.7 358.3 L 715.4 232.1 Z" stroke-linejoin="round"/>
    <path d="M 306.7 684.3 L 400.3 665.7 L 308.6 791.9 Z"/>
  </g>
  <!-- play feito de blocos (texturas HAP) -->
  <g fill="#eef0f3">
    <rect x="426" y="392" width="56" height="56" rx="8"/>
    <rect x="426" y="456" width="56" height="56" rx="8"/>
    <rect x="426" y="520" width="56" height="56" rx="8"/>
    <rect x="426" y="584" width="56" height="56" rx="8"/>
    <rect x="490" y="424" width="56" height="56" rx="8"/>
    <rect x="490" y="488" width="56" height="56" rx="8"/>
    <rect x="490" y="552" width="56" height="56" rx="8"/>
    <rect x="554" y="456" width="56" height="56" rx="8"/>
    <rect x="554" y="520" width="56" height="56" rx="8"/>
    <rect x="618" y="488" width="56" height="56" rx="8" opacity="0.9"/>
  </g>
</svg>
